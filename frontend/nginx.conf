server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:5000 http://backend:5000; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Only the public homepage serves the prerendered, indexable HTML.
    location = / {
        try_files /index.html =404;
    }

    # Account and operational routes serve the client app with noindex metadata.
    location ~ ^/(login|register|verify-email|forgot-password|reset-password|staff-onboarding|paywall|dashboard|cashier|customers|tracking|reports|settings|services|staff|profile|subscription|superadmin(?:/login|/dashboard)?)/?$ {
        try_files /app.html =404;
    }

    # Unknown URLs return a genuine 404 instead of an indexable homepage copy.
    error_page 404 /app.html;

    location = /app.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
